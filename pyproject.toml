[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c7n-kit"
version = "1.1.0"
requires-python = ">=3.11"
description = "Test Cloud Custodian policies offline, without AWS credentials, and measure compliance coverage."
readme = "README.md"
license = "Apache-2.0"
keywords = ["cloud-custodian", "c7n", "aws", "compliance", "policy-as-code", "cspm", "testing"]
authors = [
    {name = "Gustavo Ortega", email = "5921963+gustavoortega@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # 0.9.49 is the oldest release the suite has actually been run against,
    # not a guess from whatever happened to be installed when this was written.
    "c7n>=0.9.49",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Source = "https://github.com/gustavoortega/c7n-kit"
Issues = "https://github.com/gustavoortega/c7n-kit/issues"
"Policy catalogue" = "https://github.com/gustavoortega/cloud-custodian-compliance-policies"
"Write-up" = "https://gustavoortega.hashnode.dev/cloud-custodian-ships-an-engine-and-no-rules-here-are-325"

[project.scripts]
c7n-kit = "c7n_kit.cli:main"

[tool.setuptools]
packages = ["c7n_kit"]
